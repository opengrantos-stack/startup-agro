<!DOCTYPE html>
<html lang="pt">
<head>
  <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Agro - Angola</title>
    <style>
:root {
    --primary: #2e7d32;
    --primary-dark: #1b5e20;
    --primary-soft: #e8f5e9;
    --secondary: #0288d1;
    --bg-color: #f4f7f4;
    --card-bg: #ffffff;
    --text-main: #263238;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --price: #e65100;
}

* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 18px;
    color: var(--text-main);
}

.app-container {
    max-width: 1100px;
    margin: 0 auto;
}

/* HEADER */
header {
    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    color: white;
    padding: 22px 24px;
    border-radius: 18px;
    text-align: left;
    box-shadow: 0 8px 24px rgba(27,94,32,.18);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 18px;
}

header img {
    width: 72px;
    height: 72px;
    object-fit: contain;
    margin: 0 !important;
    background: white;
    border-radius: 14px;
    padding: 6px;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header p {
    margin: 5px 0 0;
    font-size: 14px;
    opacity: .9;
}

/* SECTIONS */
.card-section {
    background: var(--card-bg);
    padding: 20px;
    margin-bottom: 18px;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 14px rgba(0,0,0,.05);
}

.card-section h2 {
    font-size: 19px;
    color: var(--primary);
    margin: 0 0 16px;
}

.card-section.blue h2 {
    color: var(--secondary);
}

/* FORMS */
input, select, button, label {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 10px;
    border: 1px solid #d7dce0;
    border-radius: 10px;
    font-size: 15px;
    background: #fafbfa;
}

input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 3px rgba(46,125,50,.08);
}

button {
    background: var(--primary);
    color: white;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: .2s;
}

button:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
}

button.btn-blue {
    background: var(--secondary);
}

.file-label {
    background: var(--primary-soft);
    color: var(--primary-dark);
    text-align: center;
    cursor: pointer;
    font-weight: 700;
    border: 1px dashed #66bb6a;
    display: block;
}

/* USER */
.user-badge {
    background: white;
    border: 1px solid var(--border);
    padding: 10px 12px;
    border-radius: 12px;
    margin-bottom: 18px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* MARKET SEARCH */
#filtroProduto {
    margin-bottom: 8px;
}

#filtroProvincia {
    margin-bottom: 8px;
}

/* PRODUCT GRID */
#listaProdutos {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
}

/* PRODUCT CARD */
.item-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,.05);
    display: block;
    transition: .2s;
}

.item-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,.09);
}

.item-card .item-img {
    width: 100%;
    height: 155px;
    object-fit: cover;
    border: 0;
    border-radius: 0;
    display: block;
}

.item-info {
    padding: 13px;
}

.item-info h4 {
    margin: 0 0 7px;
    font-size: 17px;
    color: var(--text-main);
}

.item-info p {
    margin: 5px 0;
    font-size: 13px;
    color: var(--text-muted);
}

.tag-preco {
    font-weight: 800 !important;
    color: var(--price) !important;
    font-size: 17px !important;
    margin-top: 8px !important;
}

.tag-contacto {
    font-weight: 700;
    color: #c62828;
}

/* COMPACT INFO */
.item-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
}

.item-meta span {
    background: #f1f5f2;
    color: #526158;
    border-radius: 20px;
    padding: 5px 8px;
    font-size: 12px;
}

/* BLUE / NEEDS */
.item-card.blue {
    border-left: 4px solid var(--secondary);
    padding: 13px;
    display: block;
    margin-bottom: 10px;
}

.item-card.blue h4 {
    margin: 0 0 8px;
}

/* EMPTY / ERROR */
.empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 25px 10px;
}

/* HIDDEN */
.hidden {
    display: none !important;
}

/* MOBILE */
@media (max-width: 800px) {
    #listaProdutos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 560px) {
    body {
        padding: 10px;
    }

    header {
        padding: 17px;
        border-radius: 15px;
        gap: 12px;
    }

    header img {
        width: 58px;
        height: 58px;
    }

    header h1 {
        font-size: 20px;
    }

    header p {
        font-size: 12px;
    }

    .card-section {
        padding: 15px;
        border-radius: 14px;
    }

    #listaProdutos {
        grid-template-columns: 1fr;
    }

    .item-card .item-img {
        height: 190px;
    }
}

/* ===== MARKETPLACE COMPACTO ===== */

#listaProdutos {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
}

.product-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,.05);
    transition: transform .18s ease, box-shadow .18s ease;
}

.product-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,.10);
}

.product-card:active {
    transform: scale(.98);
}

.product-card-image {
    width: 100%;
    height: 145px;
    object-fit: cover;
    display: block;
    background: #eef3ee;
}

.product-card-placeholder {
    width: 100%;
    height: 145px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef3ee;
    font-size: 42px;
}

.product-card-name {
    padding: 12px 13px 14px;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
}

.product-card-name::after {
    content: "  ›";
    color: var(--primary);
    float: right;
    font-size: 20px;
}

/* ===== JANELA DE DETALHES ===== */

.product-modal {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
}

.product-modal.hidden {
    display: none !important;
}

.product-modal-content {
    width: 100%;
    max-width: 620px;
    max-height: 92vh;
    overflow-y: auto;
    background: white;
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,.20);
    position: relative;
    animation: modalUp .22s ease-out;
}

@keyframes modalUp {
    from {
        transform: translateY(30px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.product-modal-close {
    position: absolute;
    right: 14px;
    top: 14px;
    width: 38px;
    height: 38px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.55);
    color: white;
    font-size: 23px;
    line-height: 38px;
    z-index: 2;
}

.product-modal-image {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
    background: #eef3ee;
}

.product-modal-body {
    padding: 20px;
}

.product-modal-title {
    margin: 0 40px 16px 0;
    font-size: 25px;
    color: var(--text-main);
}

.product-detail-price {
    font-size: 22px;
    font-weight: 800;
    color: var(--price);
    margin-bottom: 16px;
}

.product-detail-list {
    display: grid;
    gap: 9px;
    margin-bottom: 18px;
}

.product-detail-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 12px;
    background: #f6f8f6;
    border-radius: 10px;
    font-size: 14px;
}

.product-contact-button {
    display: block;
    text-align: center;
    text-decoration: none;
    background: var(--primary);
    color: white;
    font-weight: 700;
    padding: 13px;
    border-radius: 10px;
}

.product-proof {
    margin-top: 14px;
    padding: 11px 12px;
    border-radius: 10px;
    background: #e8f5e9;
    color: var(--primary-dark);
    font-size: 13px;
}

@media (max-width: 800px) {
    #listaProdutos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .product-card-image,
    .product-card-placeholder {
        height: 125px;
    }

    .product-card-name {
        padding: 10px;
        font-size: 14px;
    }
}

@media (max-width: 380px) {
    #listaProdutos {
        gap: 8px;
    }

    .product-card-image,
    .product-card-placeholder {
        height: 115px;
    }
}


/* ===== PAINEL DE PUBLICAÇÃO EXPANSÍVEL ===== */

.publish-toggle {
    width: 100%;

    border: 0;
    border-radius: 12px;

.publish-toggle:hover {

}

.publish-arrow {
    font-size: 20px;
    transition: transform .2s ease;
}

.publish-toggle.open .publish-arrow {

}

.publish-form-wrap {

    border-top: 1px solid var(--border);
}

.publish-form-wrap.open {

}

.publish-form-wrap input,
.publish-form-wrap select {
    margin-bottom: 10px;
}

.publish-form-wrap .file-label {
    margin-bottom: 10px;
}

.publish-submit {
    margin-top: 4px;
}

</style>

    <script>
        const API = '';
        let utilizadorAtual = null;

        function gerarOwnerToken() {
            if (window.crypto && crypto.randomUUID) {
                return crypto.randomUUID();
            }

            return 'owner-' +
                Date.now().toString(36) +
                '-' +
                Math.random().toString(36).slice(2) +
                '-' +
                Math.random().toString(36).slice(2);
        }

        function fazerLogin(e) {
            e.preventDefault();

            const nome = document.getElementById('loginNome').value.trim();
            const tipo = document.getElementById('loginTipo').value;

            if (!nome || !tipo) return;

            const utilizadorAnterior =
                JSON.parse(localStorage.getItem('agro_user') || 'null');

            const ownerToken =
                utilizadorAnterior &&
                utilizadorAnterior.ownerToken
                    ? utilizadorAnterior.ownerToken
                    : gerarOwnerToken();

            utilizadorAtual = {
                nome,
                tipo,
                ownerToken
            };

            localStorage.setItem(
                'agro_user',
                JSON.stringify(utilizadorAtual)
            );

            aplicarSessao();
        }

        function aplicarSessao() {
            const salvo = localStorage.getItem('agro_user');
            if (salvo) {
                utilizadorAtual = JSON.parse(salvo);

                // Compatibilidade com sessões antigas:
                // se o utilizador ainda não tiver ownerToken,
                // o sistema cria um automaticamente.
                if (!utilizadorAtual.ownerToken) {
                    utilizadorAtual.ownerToken = gerarOwnerToken();

                    localStorage.setItem(
                        'agro_user',
                        JSON.stringify(utilizadorAtual)
                    );
                }

                }

                alert(

            try {

                    method: 'DELETE',

                        'x-admin-token': startupAgroAdminToken
                    }
                });

                const dados = await res.json();

                if (!res.ok) {
                    alert(

        function formatarDataPublicacao(data) {
            if (!data) return 'Data não informada';

            const dataObj = new Date(data);

            if (isNaN(dataObj.getTime())) {
                return 'Data não informada';
            }

            return dataObj.toLocaleString('pt-PT', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        async function registarProduto(e) {
            e.preventDefault();

            if (!utilizadorAtual || !utilizadorAtual.ownerToken) {
                alert(
                    'Não foi possível identificar o proprietário do produto.'
                );
                return;
            }

            const idEdicao =
                document.getElementById('produtoEditandoId').value.trim();

            const formData = new FormData();

            formData.append(
                'vendedor',
                utilizadorAtual.nome
            );

            formData.append(
                'produto',
                document.getElementById('produtoNome').value.trim()
            );

            formData.append(
                'preco',
                document.getElementById('produtoPreco').value.trim()
            );

            formData.append(
                'quantidade',
                document.getElementById('produtoQtd').value.trim()
            );

            formData.append(
                'provincia',
                document.getElementById('provinciaVendedor').value
            );

            formData.append(
                'contacto',
                document.getElementById('contactoVendedor').value.trim()
            );

            formData.append(
                'ownerToken',
                utilizadorAtual.ownerToken
            );

            const cameraInput =
                document.getElementById('cameraInput');

            const galleryInput =
                document.getElementById('galleryInput');

            const ficheiro =
                cameraInput.files[0] ||
                galleryInput.files[0];

            if (ficheiro) {
                formData.append('imagem', ficheiro);
            }

            const estaEditando = Boolean(idEdicao);

            const url = estaEditando
                ? `${API}/produtos/${idEdicao}`
                : `${API}/cadastrar-produto`;

            const metodo = estaEditando
                ? 'PUT'
                : 'POST';

            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: estaEditando
                        ? {
                            'x-owner-token':
                                utilizadorAtual.ownerToken
                        }
                        : {},
                    body: formData
                });

                const resultado = await res.json();

                if (!res.ok) {
                    alert(
                        resultado.erro ||
                        'Não foi possível concluir a operação.'
                    );
                    return;
                }

                alert(
                    resultado.mensagem ||
                    (
                        estaEditando
                            ? 'Produto atualizado com sucesso!'
                            : 'Produto publicado com sucesso!'
                    )
                );

                document
                    .getElementById('formProduto')
                    .reset();

                document
                    .getElementById('produtoEditandoId')
                    .value = '';

                const botao =
                    document.getElementById(
                        'botaoSubmitProduto'
                    );

                const cancelar =
                    document.getElementById(
                        'botaoCancelarEdicaoProduto'
                    );

                if (botao) {
                    botao.textContent =
                        'Publicar Produto';
                }

                if (cancelar) {
                    cancelar.style.display = 'none';
                }

                await carregarProdutos();

                const formulario =
                    document.getElementById(
                        'formPublicarProduto'
                    );

                const toggle =
                    document.getElementById(
                        'togglePublicarProduto'
                    );

                if (formulario && toggle) {
                    formulario.classList.remove('open');
                    toggle.classList.remove('open');
                }

            } catch (error) {
                console.error(
                    'ERRO AO PUBLICAR/EDITAR PRODUTO:',
                    error
                );

                alert(
                    'Não foi possível comunicar com o servidor.'
                );
            }
        }

                    'Necessidade eliminada com sucesso.'
                );

                carregarPrecisos();

            } catch (error) {
                console.error(
                    'ERRO AO ELIMINAR NECESSIDADE COMO ADMINISTRADOR:',
                    error
                );

                alert(
                    'Não foi possível comunicar com o servidor.'
                );
            }
        }

        async function registarNecessidade(e) {
            e.preventDefault();
            const dados = {
                comprador: utilizadorAtual.nome,
                produtoDesejado: document.getElementById('produtoDesejado').value,
                quantidade: document.getElementById('qtdDesejada').value,
                provincia: document.getElementById('provinciaComprador').value,
                contacto: document.getElementById('contactoComprador').value,

                // Identificação técnica automática do proprietário.
                // O comprador nunca precisa ver ou inserir este token.
                ownerToken: utilizadorAtual.ownerToken
            };

            const res = await fetch(`${API}/precisos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            const resultado = await res.json();
            alert(resultado.mensagem || resultado.erro);
            if (res.ok) {
                document.getElementById('formPreciso').reset();
                carregarPrecisos();
            }
        }

        window.onload = () => {
            aplicarSessao();
        };
    </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
